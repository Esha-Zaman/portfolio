</text><text x="332" y="447" font-size="7.2">Rat ADSC-derived exosomes (n=1)</text><text x="332" y="460" font-size="7.2">Autologous topical serum (n=2)</text><text x="332" y="473" font-size="7.2">Combination of PRP and Microneedling</text><text x="332" y="486" font-size="7.2">(n=3)</text><text x="332" y="499" font-size="7.2">Skin aging other than photoaging (n=14)</text><text x="332" y="512" font-size="7.2">PRP and Fibrin (n=1)</text><text x="332" y="525" font-size="7.2">Non-measurable outcomes (n=2)</text><rect x="92" y="518" width="161" height="60" fill="white" stroke="black" stroke-width="1.3"/><text x="100" y="533" font-size="7.2">No of studies included in qualitative</text><text x="100" y="546" font-size="7.2">synthesis</text><text x="100" y="559" font-size="7.2" font-weight="bold">n=4</text><rect x="89" y="619" width="164" height="61" fill="white" stroke="black" stroke-width="1.3"/><text x="97" y="634" font-size="7.2">No of studies included in Meta</text><text x="97" y="647" font-size="7.2">analysis</text><text x="97" y="660" font-size="7.2" font-weight="bold">n=1</text><path d="M170 178L170 198" stroke="black" stroke-width=".8" marker-end="url(#arrow)"/><path d="M170 279L170 300" stroke="black" stroke-width=".8" marker-end="url(#arrow)"/><path d="M170 361L170 396" stroke="black" stroke-width=".8" marker-end="url(#arrow)"/><path d="M170 476L170 507" stroke="black" stroke-width=".8" marker-end="url(#arrow)"/><path d="M170 584L170 610" stroke="black" stroke-width=".8" marker-end="url(#arrow)"/><path d="M264 127L314 127" stroke="black" stroke-width=".8" marker-end="url(#arrow)"/><path d="M264 239L314 239" stroke="black" stroke-width=".8" marker-end="url(#arrow)"/><path d="M264 335L314 335" stroke="black" stroke-width=".8" marker-end="url(#arrow)"/><path d="M264 436L314 436" stroke="black" stroke-width=".8" marker-end="url(#arrow)"/><text x="272" y="688" font-size="9">Figure 1 PRISMA</text></g></svg>