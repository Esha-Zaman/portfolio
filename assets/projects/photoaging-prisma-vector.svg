<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 584 700" role="img" aria-labelledby="title"><title id="title">PRISMA study-selection flow diagram</title><rect width="584" height="700" fill="white"/><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="black"/></marker></defs><g font-family="Times New Roman,serif" fill="black"><rect x="92" y="29" width="426" height="21" fill="#ed7d31" stroke="black"/><text x="190" y="43" font-size="11" font-weight="bold">Identification of Studies via Databases</text><rect x="42" y="69" width="25" height="104" fill="#67a4d1" stroke="#3a5361"/><text transform="translate(59 121.0) rotate(-90)" text-anchor="middle" font-size="10" font-weight="bold">Identification</text><rect x="42" y="189" width="25" height="171" fill="#67a4d1" stroke="#3a5361"/><text transform="translate(59 274.5) rotate(-90)" text-anchor="middle" font-size="10" font-weight="bold">Screening</text><rect x="42" y="377" width="25" height="96" fill="#67a4d1" stroke="#3a5361"/><text transform="translate(59 425.0) rotate(-90)" text-anchor="middle" font-size="10" font-weight="bold">Eligibility</text><rect x="42" y="488" width="25" height="195" fill="#67a4d1" stroke="#3a5361"/><text transform="translate(59 585.5) rotate(-90)" text-anchor="middle" font-size="10" font-weight="bold">Included</text><rect x="92" y="72" width="159" height="100" fill="white" stroke="black" stroke-width="1.3"/><text x="100" y="87" font-size="7.2">Records identified through</text><text x="100" y="100" font-size="7.2">searching 5 Databases:</text><text x="100" y="113" font-size="7.2">Google Scholar, PubMed,</text><text x="100" y="126" font-size="7.2">Cochrane Library,</text><text x="100" y="139" font-size="7.2">ProQuest, and LILAC</text><text x="100" y="152" font-size="7.2" font-weight="bold">n= 5,146</text><rect x="324" y="91" width="181" height="52" fill="white" stroke="black" stroke-width="1.3"/><text x="332" y="106" font-size=