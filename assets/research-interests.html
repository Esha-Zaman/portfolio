<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0e2736"><title>Esha Zaman — Research Interests</title><style>
*{box-sizing:border-box}body{margin:0;background:#0e2736;color:#eaf8f4;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;display:grid;place-items:center}.graph{position:relative;width:min(100vw,1000px);aspect-ratio:1.16;max-height:100vh;background:radial-gradient(ellipse at center,#214a54 0, #0e2736 68%);overflow:hidden}.lines{position:absolute;inset:0;width:100%;height:100%}.edge{stroke:#659e99;stroke-width:1.3;fill:none;transition:stroke .2s,stroke-width .2s}.orbit{stroke:#78c5b61c;fill:none;stroke-dasharray:3 9}.node{position:absolute;transform:translate(-50%,-50%);border:1px solid #94d0c163;background:#173d48;color:#e9faf4;cursor:pointer;font:600 clamp(10px,1.7vw,17px)/1.4 system-ui;text-align:center;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:9px;padding:10px;transition:background .2s,box-shadow .2s,border-color .2s;box-shadow:0 8px 30px #03171d33}.node span{font-size:clamp(20px,3.5vw,35px);font-weight:400;line-height:1;color:#a6e2d7}.major{width:25%;height:17%;border-radius:22px}.center{left:50%;top:48%;width:29%;height:34%;border-radius:50%;background:radial-gradient(circle at 35% 20%,#386b70,#173e4b);font-size:clamp(16px,2.8vw,29px);letter-spacing:-.035em;border-color:#a6e2d782}.center span{font-size:clamp(7px,1.05vw,11px);letter-spacing:.17em;font-weight:600;color:#9ed3c8}.delivery{left:23%;top:22%}.computational{left:77%;top:22%}.nano{left:23%;top:74%}.regen{left:77%;top:74%}.minor{left:23%;top:40%;width:18%;height:6.5%;font-size:clamp(8px,1.25vw,12px);border-radius:30px;background:#153640;color:#9ec6bf;border-color:#79b5aa38;box-shadow:none;padding:4px}.node:hover,.node[aria-pressed=true]{background:#bce6d9;color:#153c42;border-color:#cbf4e7;box-shadow:0 0 35px #9adbc627}.node:hover span,.node[aria-pressed=true] span{color:#28665d}.node:focus-visible{outline:3px solid #f2d69b;outline-offset:5px}.edge.on{stroke:#c4f0df;stroke-width:3}.minor[aria-pressed=true]{background:#8ec9bb}.center[aria-pressed=true]{background:#bce6d9}.center[aria-pressed=true] span{color:#28665d}@media(max-width:550px){.graph{aspect-ratio:.94}.major{width:29%;height:15%;border-radius:16px}.center{width:30%;height:29%;font-size:17px}.node{gap:7px;padding:7px}.node span{font-size:24px}.center span{font-size:7px}.minor{width:23%;height:6%;font-size:9px}.delivery,.minor,.nano{left:20%}.computational,.regen{left:80%}.lines{display:none}.graph:before{content:'';position:absolute;left:20%;right:20%;top:22%;bottom:26%;border:1px solid #77ad9e55;transform:rotate(0deg);border-radius:50%}.center{z-index:2}}
@media(prefers-reduced-motion:reduce){.node,.edge{transition:none}}

</style></head><body><main class="graph" aria-label="Interactive research interests map. Select nodes to highlight their connections."><svg class="lines" viewBox="0 0 1000 862" preserveAspectRatio="none" aria-hidden="true"><ellipse class="orbit" cx="500" cy="414" rx="300" ry="260"/><path class="edge" data-edge="delivery" d="M500 414L230 190"/><path class="edge" data-edge="computational" d="M500 414L770 190"/><path class="edge" data-edge="nano" d="M500 414L230 638"/><path class="edge" data-edge="regen" d="M500 414L770 638"/><path class="edge" data-edge="formulation" d="M230 263L230 345"/></svg><button class="node center" type="button" data-id="center" aria-pressed="false"><span>RESEARCH INTERESTS</span>Biotechnology</button><button class="node major delivery" type="button" data-id="delivery" aria-pressed="false"><span aria-hidden="true">◉</span>Drug Delivery</button><button class="node minor" type="button" data-id="formulation" aria-label="Formulation, supporting topic within drug delivery" aria-pressed="false">Formulation</button><button class="node major computational" type="button" data-id="computational" aria-pressed="false"><span aria-hidden="true">⌘</span>Computational<br>Discovery</button><button class="node major nano" type="button" data-id="nano" aria-pressed="false"><span aria-hidden="true">✧</span>Nanotechnology</button><button class="node major regen" type="button" data-id="regen" aria-pressed="false"><span aria-hidden="true">❋</span>Regenerative<br>Medicine</button></main><script>
const nodes=[...document.querySelectorAll('.node')],edges=[...document.querySelectorAll('.edge')];
function select(id){const active=nodes.find(n=>n.dataset.id===id);const clear=active.getAttribute('aria-pressed')==='true';nodes.forEach(n=>n.setAttribute('aria-pressed',String(!clear&&n===active)));edges.forEach(e=>e.classList.toggle('on',!clear&&(id==='center'||e.dataset.edge===id||(id==='formulation'&&e.dataset.edge==='delivery')||(id==='delivery'&&e.dataset.edge==='formulation'))));}
nodes.forEach(n=>n.addEventListener('click',()=>select(n.dataset.id)));
</script></body></html>
